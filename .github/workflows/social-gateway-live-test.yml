name: PHOENIX Social Gateway Live Test

on:
  push:
    branches: [main]
    paths:
      - "config/instagram_request.json"
      - ".github/workflows/social-gateway-live-test.yml"
      - "scripts/instagram_apify_test.py"
  workflow_dispatch:
    inputs:
      profile_url:
        description: "Instagram public profile URL or username"
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-test:
    name: Public Instagram acquisition test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Resolve profile
        env:
          DISPATCH_PROFILE: ${{ inputs.profile_url }}
        shell: bash
        run: |
          if [ -n "$DISPATCH_PROFILE" ]; then
            echo "INSTAGRAM_PROFILE_URL=$DISPATCH_PROFILE" >> "$GITHUB_ENV"
          else
            PROFILE_URL="$(python -c 'import json; print(json.load(open("config/instagram_request.json", encoding="utf-8"))["profile_url"].strip())')"
            test -n "$PROFILE_URL"
            echo "INSTAGRAM_PROFILE_URL=$PROFILE_URL" >> "$GITHUB_ENV"
          fi
      - name: Acquire public Instagram evidence with Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python scripts/instagram_apify_test.py
      - name: Verify acquisition
        run: |
          python - <<'PY'
          import glob,json
          files=glob.glob("artifacts/instagram_*.json")
          if not files: raise SystemExit("no acquisition artifact")
          with open(files[0],encoding="utf-8") as f: data=json.load(f)
          if not data.get("items"): raise SystemExit("empty acquisition")
          print(json.dumps({"status":"verified","username":data.get("username"),"item_count":data.get("item_count")},ensure_ascii=False))
          PY
      - name: Upload acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-instagram-evidence-${{ github.run_id }}
          path: artifacts/instagram_*.json
          if-no-files-found: error
