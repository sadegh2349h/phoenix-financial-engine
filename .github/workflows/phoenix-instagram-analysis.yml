name: PHOENIX Instagram Analysis

on:
  push:
    paths:
      - "config/instagram_request.json"
      - "scripts/instagram_apify_test.py"
  workflow_dispatch:
    inputs:
      profile_url:
        description: "Instagram public profile URL or username"
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Resolve profile
        env:
          DISPATCH_PROFILE: ${{ inputs.profile_url }}
        run: |
          if [ -n "$DISPATCH_PROFILE" ]; then
            echo "INSTAGRAM_PROFILE_URL=$DISPATCH_PROFILE" >> "$GITHUB_ENV"
          else
            python - <<'PY'
import json
from pathlib import Path
url=json.loads(Path("config/instagram_request.json").read_text()) ["profile_url"].strip()
if not url: raise SystemExit("missing profile_url")
with open("$GITHUB_ENV","a") as f: f.write("INSTAGRAM_PROFILE_URL="+url+"\n")
PY
          fi
      - name: Acquire public Instagram evidence
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python scripts/instagram_apify_test.py
      - name: Verify evidence
        run: |
          python - <<'PY'
import glob,json
files=glob.glob("artifacts/instagram_*.json")
if not files: raise SystemExit("no evidence artifact")
data=json.load(open(files[0],encoding="utf-8"))
if not data.get("items"): raise SystemExit("empty acquisition")
print("VERIFIED",data.get("username"),data.get("item_count"))
PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-instagram-evidence-${{ github.run_id }}
          path: artifacts/instagram_*.json
          if-no-files-found: error
