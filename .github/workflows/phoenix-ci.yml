name: PHOENIX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHOENIX test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify package import
        run: >-
          python -c "import phoenix_core; print('PHOENIX import: OK')"
      - name: Verify API health
        run: >-
          python -c "from phoenix_core.http_api import health; result = health(); assert result['service'] == 'phoenix'; assert result['status'] in {'healthy', 'degraded'}; print(result)"
      - name: Run tests
        run: python -m pytest -q -ra
