name: PHOENIX CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHOENIX test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  docker-build:
    name: PHOENIX container build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build container
        run: docker build --pull -t phoenix-financial-engine:${{ github.sha }} .
      - name: Smoke test container
        run: docker run --rm phoenix-financial-engine:${{ github.sha }} python -c "import phoenix_core; print('PHOENIX import: OK')"
