name: PHOENIX Operational Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  operational-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Deterministic operational tests
        run: python -m pytest -q tests/test_operational_paths.py
      - name: Financial engine failover integration test
        run: python -m pytest -q tests/test_financial_engine.py
      - name: Market shadow evaluation contract tests
        run: python -m pytest -q tests/test_market_evaluation.py
      - name: Live BTC performance evaluation
        run: python scripts/market_shadow_report.py
      - name: Compare against previous PHOENIX baseline
        run: python scripts/compare_performance.py
      - name: Publish PHOENIX performance report
        if: always()
        run: |
          for f in phoenix_performance_report.md phoenix_performance_comparison.md; do
            if [ -f "$f" ]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Send PHOENIX performance report to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_performance_report.py
      - name: Persist performance reports
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-market-evaluation
          path: |
            phoenix_market_evaluation.json
            phoenix_performance_report.md
            phoenix_performance_report.json
            phoenix_performance_comparison.md
          if-no-files-found: error

  live-telegram:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Telegram live health and delivery
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_health_check.py
