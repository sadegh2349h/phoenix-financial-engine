name: PHOENIX Telegram Health Check

on:
  workflow_dispatch:

jobs:
  telegram-health:
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -e

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "RESULT: TOKEN_MISSING"
            exit 1
          fi

          RESPONSE=$(curl -sS --max-time 15 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "RESULT: BOT_AUTH_SUCCESS"
          else
            echo "RESULT: BOT_AUTH_FAILED"
            echo "Telegram API response:"
            echo "$RESPONSE" | sed -E 's/[0-9]{8,}:[A-Za-z0-9_-]+/[TOKEN_REDACTED]/g'
            exit 1
          fi

      - name: Send Telegram Test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "RESULT: TOKEN_MISSING"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "RESULT: CHAT_ID_MISSING"
            exit 1
          fi

          RESPONSE=$(curl -sS --max-time 15 \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔥 PHOENIX — تست اتصال تلگرام با موفقیت انجام شد.")

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "RESULT: TELEGRAM_MESSAGE_SUCCESS"
          else
            echo "RESULT: TELEGRAM_MESSAGE_FAILED"
            echo "Telegram API response:"
            echo "$RESPONSE" | sed -E 's/[0-9]{8,}:[A-Za-z0-9_-]+/[TOKEN_REDACTED]/g'
            exit 1
          fi 
