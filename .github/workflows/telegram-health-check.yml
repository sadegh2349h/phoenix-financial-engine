name: PHOENIX Telegram Health Check

on:
  workflow_dispatch:

jobs:
  telegram-health:
    runs-on: ubuntu-latest

    steps:
      - name: Runner test
        run: |
          echo "PHOENIX Runner is working"
          echo "Telegram health check started"

      - name: Check Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing"
            exit 1
          fi

          RESPONSE=$(curl -sS --max-time 15 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")

          echo "$RESPONSE" | grep -q '"ok":true' || {
            echo "ERROR: Telegram Bot authentication failed"
            exit 1
          }

          echo "Telegram Bot: OK"

      - name: Send Telegram Test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is missing"
            exit 1
          fi

          RESPONSE=$(curl -sS --max-time 15 \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔥 PHOENIX — تست اتصال تلگرام با موفقیت انجام شد.")

          echo "$RESPONSE" | grep -q '"ok":true' || {
            echo "ERROR: Telegram message delivery failed"
            exit 1
          }

          echo "Telegram message: SENT SUCCESSFULLY"
