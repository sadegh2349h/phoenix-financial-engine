name: PHOENIX Telegram Health Check

on:
  workflow_dispatch:

jobs:
  telegram-health:
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -e

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is not configured."
            exit 1
          fi

          RESPONSE=$(curl -sS \
            --max-time 15 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")

          echo "$RESPONSE" | grep -q '"ok":true'

          echo "Telegram Bot connection: SUCCESS"

      - name: Send Test Message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: Telegram secrets are not configured."
            exit 1
          fi

          RESPONSE=$(curl -sS \
            --max-time 15 \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔥 PHOENIX Telegram Health Check — اتصال تلگرام با موفقیت تأیید شد.")

          echo "$RESPONSE" | grep -q '"ok":true'

          echo "Telegram message delivery: SUCCESS"
