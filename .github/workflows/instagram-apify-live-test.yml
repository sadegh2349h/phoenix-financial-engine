name: PHOENIX Instagram Apify Live Test

on:
  workflow_dispatch:
    inputs:
      profile_url:
        description: "Instagram public profile URL or username"
        required: false
        type: string
  repository_dispatch:
    types: [instagram-profile-analysis]
  push:
    paths:
      - "scripts/instagram_apify_test.py"
      - ".github/workflows/instagram-apify-live-test.yml"
      - "config/instagram_request.json"

env:
  INSTAGRAM_PROFILE_URL: ${{ github.event.inputs.profile_url || github.event.client_payload.profile_url || '' }}

jobs:
  instagram-apify-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve requested profile
        shell: bash
        run: |
          if [ -z "$INSTAGRAM_PROFILE_URL" ] && [ -f config/instagram_request.json ]; then
            PROFILE_URL="$(python - <<'PY'
import json
from pathlib import Path
p = Path('config/instagram_request.json')
data = json.loads(p.read_text(encoding='utf-8'))
print(data.get('profile_url', '').strip())
PY
)"
            echo "INSTAGRAM_PROFILE_URL=$PROFILE_URL" >> "$GITHUB_ENV"
          fi

      - name: Validate requested profile
        run: |
          test -n "$INSTAGRAM_PROFILE_URL" || { echo "No Instagram profile URL supplied"; exit 2; }
          echo "Requested Instagram profile: $INSTAGRAM_PROFILE_URL"

      - name: Run live acquisition test
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python scripts/instagram_apify_test.py

      - name: Upload acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-apify-evidence
          path: artifacts/instagram_*.json
          if-no-files-found: ignore
