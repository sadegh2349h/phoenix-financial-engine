name: PHOENIX Instagram Apify Live Test

on:
  workflow_dispatch:
    inputs:
      profile_url:
        description: "Instagram public profile URL"
        required: true
        default: "https://www.instagram.com/mahmoud_julaei/"
  push:
    paths:
      - "scripts/instagram_apify_test.py"
      - ".github/workflows/instagram-apify-live-test.yml"

env:
  INSTAGRAM_PROFILE_URL: ${{ github.event.inputs.profile_url || 'https://www.instagram.com/mahmoud_julaei/' }}

jobs:
  instagram-apify-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run live acquisition test
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python scripts/instagram_apify_test.py

      - name: Upload acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-apify-evidence
          path: artifacts/instagram_*.json
          if-no-files-found: ignore
